<!DOCTYPE html>
<html>
<head>
    <title>Vima Advanced Audio</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .audio-player {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        button:hover {
            background: #45a049;
        }
        
        .volume-control {
            margin-top: 10px;
        }
        
        input[type="range"] {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vima Advanced Audio System</h1>
        
        <div class="audio-player">
            <h2>Media Player</h2>
            <div class="controls">
                <button id="playBtn">Play</button>
                <button id="pauseBtn">Pause</button>
                <button id="stopBtn">Stop</button>
            </div>
            
            <div class="volume-control">
                <label for="volumeSlider">Volume:</label>
                <input type="range" id="volumeSlider" min="0" max="100" value="50">
            </div>
        </div>
        
        <div class="audio-info">
            <h3>Current Settings</h3>
            <p>Tier: <span id="currentTier">Basic</span></p>
            <p>Battery Level: <span id="batteryLevel">100%</span></p>
            <p>Status: <span id="status">Active</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
</script>
