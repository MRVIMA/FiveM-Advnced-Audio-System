<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VØIDVIMA Audio System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container" id="main-container" style="display: none;">
        <div class="glass-panel">
            
            <div class="header">
                <div class="brand">
                    <span class="v-logo">VØID</span>VIMA
                </div>
                <div class="close-btn" id="closeBtn">
                    <i class="fas fa-times"></i>
                </div>
            </div>

            <div class="visualizer" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>

            <div class="url-input-container">
    <input type="text" id="musicUrl" placeholder="Paste Audio URL (YouTube/MP3)..." class="cyber-input">
    <button id="loadUrlBtn" class="load-btn"><i class="fas fa-cloud-download-alt"></i></button>
</div>

<audio id="streamPlayer"></audio>

            <div class="media-player">
                <div class="controls">
                    <button id="playBtn" class="control-btn play" title="Play"><i class="fas fa-play"></i></button>
                    <button id="pauseBtn" class="control-btn" title="Pause"><i class="fas fa-pause"></i></button>
                    <button id="stopBtn" class="control-btn stop" title="Stop"><i class="fas fa-stop"></i></button>
                </div>

                <div class="volume-container">
                    <i class="fas fa-volume-down"></i>
                    <input type="range" id="volumeSlider" class="cyber-slider" min="0" max="100" value="50">
                    <i class="fas fa-volume-up"></i>
                </div>
            </div>

            <div class="system-info">
                <div class="info-card">
                    <span class="label">SYS TIER</span>
                    <span class="value accent" id="currentTier">STOCK</span>
                </div>
                <div class="info-card">
                    <span class="label">POWER</span>
                    <div class="battery-wrapper">
                        <div class="battery-bar" id="batteryBar" style="width: 100%;"></div>
                    </div>
                    <span class="value" id="batteryLevel">100%</span>
                </div>
                <div class="info-card">
                    <span class="label">STATUS</span>
                    <span class="value active-status" id="statusText">STANDBY</span>
                </div>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
